<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Janelas Digitais</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #cfe0f0 0%, #eef3f8 55%, #f4f2ee 100%);
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow-y: auto;
  }
  h1 { font-size: 20px; color: #333; margin-bottom: 4px; }

  /* ---------- Página inicial ---------- */
  #landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    width: 100%;
    text-align: center;
    background: linear-gradient(160deg, #ffe27a 0%, #ffb6d9 45%, #a3d9ff 100%);
    border-radius: 28px;
    padding: 30px 20px;
    position: relative;
    overflow: hidden;
  }
  #landing::before,
  #landing::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
  }
  #landing::before {
    width: 140px;
    height: 140px;
    top: -50px;
    left: -40px;
  }
  #landing::after {
    width: 100px;
    height: 100px;
    bottom: -30px;
    right: -20px;
  }
  .window-icon {
    width: 100px;
    height: 100px;
    margin-bottom: 18px;
    border: 5px solid #ff8fb3;
    border-radius: 20px;
    position: relative;
    background: linear-gradient(135deg, #fff4b8 0%, #ffd3e6 50%, #bfe6ff 100%);
    box-shadow: 0 8px 0 rgba(255, 143, 179, 0.35);
    animation: bounce 2.2s ease-in-out infinite;
  }
  .window-icon::before,
  .window-icon::after {
    content: "";
    position: absolute;
    background: #ff8fb3;
    border-radius: 3px;
  }
  .window-icon::before {
    left: 50%;
    top: 8px;
    bottom: 8px;
    width: 6px;
    transform: translateX(-50%);
  }
  .window-icon::after {
    top: 50%;
    left: 8px;
    right: 8px;
    height: 6px;
    transform: translateY(-50%);
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }
  #landing h1 {
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    font-size: 40px;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 2px 2px 0 #ff8fb3, -1px -1px 0 #ff8fb3, 1px -1px 0 #ff8fb3, -1px 1px 0 #ff8fb3;
    margin-bottom: 10px;
  }
  #landing p {
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    font-size: 17px;
    color: #5a4a6b;
    margin-bottom: 26px;
    max-width: 360px;
  }
  #landingStartBtn {
    font-family: 'Trebuchet MS', Verdana, sans-serif;
    font-size: 19px;
    font-weight: bold;
    padding: 14px 48px;
    background: #ff8fb3;
    border-radius: 50px;
    box-shadow: 0 6px 0 #e06e94;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  #landingStartBtn:hover { background: #ff7aa5; }
  #landingStartBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #e06e94;
  }

  #exitBtn {
    position: fixed;
    top: 14px;
    right: 16px;
    font-size: 12px;
    padding: 6px 12px;
    background: rgba(120, 120, 120, 0.35);
    color: #444;
    border-radius: 5px;
    z-index: 10;
    display: none;
  }
  #exitBtn:hover {
    background: rgba(120, 120, 120, 0.55);
  }
  #testArea {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  #status {
    display: none;
  }
  #board {
    position: relative;
    width: min(92vw, 1100px);
    height: min(64vh, 680px);
    background: #fdfcfa;
    border: 1px solid #999;
    border-radius: 4px;
  }
  .square {
    position: absolute;
    width: 72px;
    height: 72px;
    background: #fdfcfa;
    border: 3px solid #222;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease;
  }
  .square.lit {
    background-color: #4a90d9;
    border-color: #2a5f9e;
  }
  .square.correct {
    background-color: #333;
    border-color: #000;
  }
  .square.wrong {
    background-color: #333;
    border-color: #000;
  }
  .square.disabled {
    cursor: default;
  }
  #controls { margin-top: 20px; }
  button {
    font-size: 15px;
    padding: 10px 22px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    cursor: pointer;
  }
  button:disabled {
    background: #aaa;
    cursor: default;
  }
  #results {
    margin-top: 24px;
    font-size: 15px;
    color: #333;
    white-space: pre-line;
    text-align: left;
    background: white;
    padding: 16px 20px;
    border-radius: 6px;
    border: 1px solid #ddd;
    display: none;
    max-width: 500px;
  }
</style>
</head>
<body>

<div id="hubGate" style="position:fixed;inset:0;background:linear-gradient(135deg,#f7f6f3,#eae7e2);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Inter',Arial,sans-serif;color:#1a1a1a;">
  <div style="background:#fff;padding:40px 36px;border-radius:18px;box-shadow:0 15px 40px rgba(0,0,0,0.12);width:320px;text-align:center;">
    <h1 id="hubGateTitulo" style="font-size:1.3rem;font-weight:600;margin-bottom:6px;">🔒 Verificando acesso</h1>
    <p id="hubGateSubtitulo" style="font-size:0.85rem;color:#666;margin-bottom:8px;">Só um instante...</p>
    <div id="hubGateSpinner" style="width:28px;height:28px;margin:18px auto 0;border:3px solid #ddd;border-top-color:#222;border-radius:50%;animation:hubGateSpin 0.8s linear infinite;"></div>
    <div id="hubGateMsg" style="margin-top:14px;font-size:0.85rem;color:#c0392b;min-height:18px;"></div>
  </div>
</div>
<style>@keyframes hubGateSpin { to { transform: rotate(360deg); } }</style>

<script>
const SUPABASE_URL = "https://bjzmlvsskhfrkvblvsjj.supabase.co";
const SUPABASE_KEY = "sb_publishable_YEHAM35S4jsY_dKoN5mwzg_YOVoVWJR";
const SITE = "jdneup";
let hubToken = null;
let hubSessaoId = null;

function hubMostrarErro(texto) {
  document.getElementById('hubGateSpinner').style.display = 'none';
  document.getElementById('hubGateTitulo').textContent = '🔒 Acesso restrito';
  document.getElementById('hubGateSubtitulo').textContent = 'Não foi possível liberar a entrada.';
  document.getElementById('hubGateMsg').textContent = texto;
}

function hubLiberarAcesso() {
  document.getElementById('hubGate').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
}

async function hubValidarToken(token) {
  try {
    const resp = await fetch(SUPABASE_URL + "/functions/v1/validar-token", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
      body: JSON.stringify({ token, site: SITE })
    });
    const data = await resp.json();
    if (data.ok) {
      hubToken = token;
      hubSessaoId = data.sessao_id;
      hubLiberarAcesso();
      return;
    }
    hubMostrarErro(data.motivo || "Link inválido ou expirado.");
  } catch (e) {
    hubMostrarErro("Erro ao verificar o link. Tente novamente.");
  }
}

(function() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("t");
  if (token) {
    hubValidarToken(token);
  } else {
    hubMostrarErro("O acesso a este teste é feito apenas por um link individual, gerado pelo hub.");
  }
})();
</script>

<button id="exitBtn">Finalizar agora</button>

<div id="landing" style="display:none;">
  <div class="window-icon"></div>
  <h1>Janelas Digitais</h1>
  <p>Observe atentamente e responda quando for sua vez.</p>
  <button id="landingStartBtn">Iniciar</button>
</div>

<div id="testArea">
  <div id="status">Clique em "Iniciar" para começar a Sequência 1 de 8.</div>
  <div id="board"></div>
  <div id="controls">
    <button id="startBtn">Iniciar</button>
    <button id="finishBtn" style="display:none;">Concluir sequência</button>
  </div>
  <div id="results"></div>
</div>

<script>
document.getElementById('landingStartBtn').addEventListener('click', () => {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('testArea').style.display = 'flex';
  document.getElementById('exitBtn').style.display = 'inline-block';
});
</script>

<script>

// Posições dos 8 quadrados (em % do tamanho do board), baseadas no layout desenhado.
// id = número interno do quadrado (não aparece na tela)
const SQUARES = [
  { id: 1, xPct: 33, yPct: 25 },
  { id: 2, xPct: 60, yPct: 14 },
  { id: 3, xPct: 80, yPct: 34 },
  { id: 4, xPct: 43, yPct: 47 },
  { id: 5, xPct: 71, yPct: 55 },
  { id: 6, xPct: 24, yPct: 71 },
  { id: 7, xPct: 52, yPct: 71 },
  { id: 8, xPct: 87, yPct: 80 },
];

// Sequência fixa de cada uma das 8 rodadas (números correspondem ao id do quadrado).
const SEQUENCES = [
  [8, 1],
  [6, 3],
  [5, 6, 7],
  [4, 3, 8],
  [1, 8, 7, 6],
  [3, 5, 1, 2],
  [3, 4, 5, 2, 6],
  [7, 1, 8, 6, 2],
];

const FLASH_ON_MS = 700;   // duração de cada quadrado aceso
const FLASH_GAP_MS = 300;  // pausa entre os quadrados da sequência

// ------------------------------------------------

const board = document.getElementById('board');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const finishBtn = document.getElementById('finishBtn');
const exitBtn = document.getElementById('exitBtn');
const resultsEl = document.getElementById('results');

let currentRound = 0;
let currentSequence = [];
let userInput = [];
let acceptingClicks = false;
let results = []; // { round, length, sequence, userAnswer, correct }

// cria os elementos dos quadrados
const squareEls = {};
SQUARES.forEach(sq => {
  const el = document.createElement('div');
  el.className = 'square';
  el.style.left = `calc(${sq.xPct}% - 36px)`;
  el.style.top = `calc(${sq.yPct}% - 36px)`;
  el.dataset.id = sq.id;
  el.addEventListener('click', () => handleClick(sq.id, el));
  board.appendChild(el);
  squareEls[sq.id] = el;
});

function generateSequence(roundIndex) {
  return SEQUENCES[roundIndex];
}

function sleep(ms) {
  return new Promise(res => setTimeout(res, ms));
}

async function playSequence(seq) {
  acceptingClicks = false;
  for (const id of seq) {
    const el = squareEls[id];
    el.classList.add('lit');
    await sleep(FLASH_ON_MS);
    el.classList.remove('lit');
    await sleep(FLASH_GAP_MS);
  }
  acceptingClicks = true;
  userInput = [];
  finishBtn.style.display = 'inline-block';
  statusEl.textContent = `Sequência ${currentRound + 1} de 8 — sua vez (clique na ordem em que os quadrados acenderam)`;
}

function handleClick(id, el) {
  if (!acceptingClicks) return;
  userInput.push(id);

  const idx = userInput.length - 1;
  const isCorrectSoFar = idx < currentSequence.length && userInput[idx] === currentSequence[idx];

  el.classList.add(isCorrectSoFar ? 'correct' : 'wrong');
  setTimeout(() => el.classList.remove('correct', 'wrong'), 300);
}

function computeCorrect() {
  return (
    userInput.length === currentSequence.length &&
    userInput.every((v, i) => v === currentSequence[i])
  );
}

function finishRound() {
  acceptingClicks = false;
  finishBtn.style.display = 'none';
  const correct = computeCorrect();
  results.push({
    round: currentRound + 1,
    length: currentSequence.length,
    sequence: [...currentSequence],
    userAnswer: [...userInput],
    correct
  });

  statusEl.textContent = correct ? '✅ Correto!' : '❌ Incorreto.';

  setTimeout(() => {
    currentRound++;
    if (currentRound < SEQUENCES.length) {
      startBtn.textContent = `Iniciar Sequência ${currentRound + 1}`;
      startBtn.style.display = 'inline-block';
      startBtn.disabled = false;
      statusEl.textContent = `Clique em "Iniciar" para a Sequência ${currentRound + 1} de 8.`;
    } else {
      showResults();
    }
  }, 900);
}

finishBtn.addEventListener('click', finishRound);

exitBtn.addEventListener('click', () => {
  acceptingClicks = false;
  showResults();
});

function buildSessionData() {
  return {
    test: 'janelas-digitais',
    finishedAt: new Date().toISOString(),
    results // cada rodada: { round, length, sequence, userAnswer, correct }
  };
}

function showResults() {
  startBtn.style.display = 'none';
  finishBtn.style.display = 'none';
  exitBtn.style.display = 'none';

  if (hubToken) {
    fetch(SUPABASE_URL + "/functions/v1/concluir-sessao", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
      body: JSON.stringify({ token: hubToken, dados: buildSessionData() })
    }).catch(() => {});
  }

  document.body.innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:1.2rem;color:#333;text-align:center;padding:20px;background:#fff;'>Teste concluído. Obrigado!</div>";
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.style.display = 'none';
  currentSequence = generateSequence(currentRound);
  statusEl.textContent = `Sequência ${currentRound + 1} de 8 — observe...`;
  await sleep(600);
  await playSequence(currentSequence);
});
</script>

</body>
</html>
